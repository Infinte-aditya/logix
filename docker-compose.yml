services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  log-generator:
    build: ./services/log-generator
    env_file: .env
    environment:
      LOG_PATH: /data/app.log
    volumes:
      - logdata:/data
    stop_signal: SIGTERM
    stop_grace_period: 5s

  detector:
    build: ./services/detector
    env_file: .env
    environment:
      LOG_PATH: /data/app.log
      REDIS_URL: redis://redis:6379/0
      ALERT_CHANNEL: alerts
      WINDOW_SECONDS: "60"
      ALPHA: "0.05"
    volumes:
      - logdata:/data
    depends_on:
      redis:
        condition: service_healthy
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.Redis.from_url('redis://redis:6379/0',decode_responses=True); r.ping(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ALERT_CHANNEL: alerts
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build: ./services/notifier
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ALERT_CHANNEL: alerts
      MIN_SEVERITY: MEDIUM
      AWS_REGION: us-east-1
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:logix-alerts
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      CW_LOG_GROUP: ""
    depends_on:
      redis:
        condition: service_healthy
      moto:
        condition: service_started
        required: false
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r=redis.Redis.from_url('redis://redis:6379/0',decode_responses=True); r.ping(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  moto:
    image: motoserver/moto:5.2.3
    environment:
      MOTO_ACCOUNT_ID: "000000000000"
    ports:
      - "5000:5000"
    profiles:
      - local-aws

  frontend:
    build:
      context: ./services/frontend
      args:
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8001/ws}
    ports:
      - "8080:8080"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  logdata:
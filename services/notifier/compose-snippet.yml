services:
  notifier:
    build: ./services/notifier
    environment:
      REDIS_URL: redis://redis:6379/0
      ALERT_CHANNEL: alerts
      MIN_SEVERITY: MEDIUM
      AWS_REGION: us-east-1
      # placeholder - replace with the real TopicArn (see infra/README.md)
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:logix-alerts
      # local AWS mock (moto server, compose profile local-aws); unset for real AWS
      # (credentials via env/role only; mock creds test/test are set in docker-compose.yml)
      AWS_ENDPOINT_URL: http://moto:5000
      # optional second sink; empty = disabled
      CW_LOG_GROUP: ""
    depends_on:
      - redis
    restart: unless-stopped
